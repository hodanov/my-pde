services:
  otel-lgtm:
    container_name: claude-otel-lgtm
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    restart: unless-stopped
    environment:
      LOKI_EXTRA_ARGS: -ingester.wal-disk-full-threshold=0.98
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ${HOME}/.local/state/claude-otel-lgtm:/data
      - ./provisioning/claude-code-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/claude-code-dashboards.yaml:ro
      - ./dashboards:/claude-dashboards:ro

# ---- Dotfiles ----

[tasks.dotfiles-link]
description = "Symlink dotfiles/wezterm -> ~/.config/wezterm"
run = '''
mkdir -p "$HOME/.config"
rm -f "$HOME/.wezterm.lua"
ln -sfn "{{config_root}}/dotfiles/wezterm" "$HOME/.config/wezterm"
echo "Linked {{config_root}}/dotfiles/wezterm -> $HOME/.config/wezterm"
'''

[tasks.dotfiles-unlink]
description = "Remove the ~/.config/wezterm symlink"
run = '''
rm -f "$HOME/.config/wezterm"
echo "Unlinked $HOME/.config/wezterm"
'''

# WezTerm tracks the nightly channel (see docs/plan/2026-09-05_wezterm-nightly-migration.md),
# so the terminal underneath this config can move without warning. `show-keys` parses the
# config in a separate process from the GUI, and the Lua test exercises the mux API surface
# the dashboard is built on; between them they catch a broken nightly immediately.
[tasks.wezterm-verify]
description = "Smoke-test the WezTerm config against the installed wezterm"
dir = "{{config_root}}"
run = '''
wezterm --version
wezterm --config-file dotfiles/wezterm/wezterm.lua show-keys >/dev/null
echo "show-keys: ok"
if command -v luajit >/dev/null 2>&1; then
	luajit dotfiles/wezterm/tests/ai-panes_test.lua
else
	echo "ai-panes_test.lua: skipped (luajit not on PATH)"
fi
'''

# ~/.zshrc is deliberately not wired into dotfiles-link: replacing the login
# shell config is far more disruptive than a wezterm directory symlink, so it
# stays an explicit, opt-in command.
[tasks.zshrc-link]
description = "Symlink dotfiles/.zshrc -> ~/.zshrc (backs up an existing regular file)"
run = '''
if [ -e "$HOME/.zshrc" ] && [ ! -L "$HOME/.zshrc" ]; then
  backup="$HOME/.zshrc.bak"
  if [ -e "$backup" ]; then
    backup="$HOME/.zshrc.bak.$(date +%Y%m%d%H%M%S)"
  fi
  mv "$HOME/.zshrc" "$backup"
  echo "Backed up existing $HOME/.zshrc -> $backup"
fi
ln -sfn "{{config_root}}/dotfiles/.zshrc" "$HOME/.zshrc"
echo "Linked {{config_root}}/dotfiles/.zshrc -> $HOME/.zshrc"
'''

[tasks.zshrc-unlink]
description = "Remove the ~/.zshrc symlink (restores the most recent backup if present)"
run = '''
if [ ! -L "$HOME/.zshrc" ]; then
  echo "$HOME/.zshrc is not a symlink; leaving it alone."
  exit 0
fi
rm -f "$HOME/.zshrc"
echo "Unlinked $HOME/.zshrc"
# Restore the newest backup, not just .zshrc.bak: zshrc-link falls back to
# .zshrc.bak.<timestamp> when .zshrc.bak is already taken, and those sort
# lexicographically, so the last match is the most recently replaced config.
backup=""
for candidate in "$HOME"/.zshrc.bak.*; do
  if [ -e "$candidate" ]; then
    backup="$candidate"
  fi
done
if [ -z "$backup" ] && [ -e "$HOME/.zshrc.bak" ]; then
  backup="$HOME/.zshrc.bak"
fi
if [ -n "$backup" ]; then
  mv "$backup" "$HOME/.zshrc"
  echo "Restored $HOME/.zshrc from $backup"
fi
'''

# ---- Repo-wide lint (CI parity) ----

[tasks."lint:shell"]
description = "Run shfmt and shellcheck on all shell scripts"
run = [
  "find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -exec shfmt -d {} +",
  "find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -exec shellcheck {} +",
]

[tasks."lint:stylua"]
description = "Run stylua check on all Lua files"
run = "stylua --check ."

[tasks."lint:docker"]
description = "Run hadolint on the nvim Dockerfile"
run = "hadolint environment/docker/nvim.dockerfile"

[tasks."lint:actions"]
description = "Run actionlint (with shellcheck integration) on GitHub Actions workflows"
run = "actionlint"

[tasks."lint:format"]
description = "Run tombi, prettier, and markdownlint via environment/tools/node"
dir = "{{config_root}}"
run = '''
npm --prefix environment/tools/node install
export PATH="$PWD/environment/tools/node/node_modules/.bin:$PATH"
tombi lint
prettier --check .
markdownlint-cli2 "**/*.md"
'''

[tasks.lint]
description = "Run all repo-wide linters (CI parity)"
depends = [
  "lint:shell",
  "lint:stylua",
  "lint:docker",
  "lint:actions",
  "lint:format",
]

# ---- Changed-files verification (human entry point; the verify-runner
# subagent runs ai-agents/scripts/verify-changed.sh directly) ----

[tasks."verify:changed"]
description = "Run tests/linters mapped to changed files (pass files after --)"
run = '"{{config_root}}/ai-agents/scripts/verify-changed.sh"'

# ---- Docker ----

[tasks."docker:build"]
description = "Build the nvim image with versions injected from mise.toml"
# GO_VERSION / NODE_VERSION are NOT passed as --build-arg: the Dockerfile ARG
# defaults are generated from mise.toml [tools] by `pins:sync` and verified by
# `pins:check`, so the build always uses the mise-pinned versions without
# depending on the host's active go/node. The remaining [env]-sourced args are
# likewise synced ARG defaults; passing them keeps the injection explicit.
#
# DOCKER_BUILD_EXTRA_ARGS is an opt-in escape hatch so CI can add BuildKit cache
# flags (--cache-from/--cache-to) without forking the build command. It is unset
# locally, so `mise run docker:build` behaves exactly as before. The unquoted
# expansion is intentional: the value is meant to split into separate arguments.
run = '''
docker buildx build \
  --file environment/docker/nvim.dockerfile \
  --tag my-pde-nvim:dev \
  --build-arg LUA_LS_VERSION="$LUA_LS_VERSION" \
  --build-arg NEOVIM_VERSION="$NEOVIM_VERSION" \
  --build-arg NPM_VERSION="$NPM_VERSION" \
  --build-arg RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
  --build-arg TERRAFORM_VERSION="$TERRAFORM_VERSION" \
  ${DOCKER_BUILD_EXTRA_ARGS:-} \
  --progress=plain .
'''

# ---- Pinned artifacts (generated from mise.toml) ----

[tasks."pins:sync"]
description = "Regenerate go-tools.txt and Dockerfile ARG defaults from mise.toml"
run = '"{{config_root}}/environment/tools/sync-pins.sh"'

[tasks."pins:check"]
description = "Verify generated pins are in sync with mise.toml"
depends = ["pins:sync"]
run = "git diff --exit-code -- environment/tools/go/go-tools.txt environment/docker/nvim.dockerfile"

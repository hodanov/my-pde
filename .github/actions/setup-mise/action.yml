name: Setup mise
description: Install a mise release older than the cooldown and the tools locked in mise.lock

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        minimum_release_age: 14d
      env:
        GITHUB_TOKEN: ${{ github.token }}

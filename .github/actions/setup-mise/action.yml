name: Setup mise
description: Install a mise release older than the cooldown and the tools locked in mise.lock

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        minimum_release_age: 14d
      env:
        GITHUB_TOKEN: ${{ github.token }}

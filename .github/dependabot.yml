version: 2
updates:
  - package-ecosystem: "uv"
    directory: "./environment/tools/python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "./environment/tools/node"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      npm-tools:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "./environment/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directory: "./environment/otel"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directories:
      - "/scripts/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      workflow-dependencies:
        patterns:
          - "*"

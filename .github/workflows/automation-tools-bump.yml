name: "[Automation] Tools Bump"

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Resolve latest eligible versions (policy-pinned tools)
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # -f fails on HTTP errors (caught by set -e + pipefail), -S surfaces the
          # error, --retry/--max-time absorb transient failures. Without -f, curl
          # returns exit 0 on 4xx/5xx and pipes the error body into jq → junk values.
          CURL=(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors --max-time 30)

          MIN_AGE=$(mise settings get minimum_release_age)
          if [[ ! "$MIN_AGE" =~ ^[0-9]+d$ ]]; then
            echo "::error::minimum_release_age in mise.toml must be whole days (e.g. 14d): '$MIN_AGE'" >&2
            exit 1
          fi
          CUTOFF=$(date -u -d "${MIN_AGE%d} days ago" +%Y-%m-%dT%H:%M:%SZ)
          SEMVER='^v?[0-9]+\.[0-9]+\.[0-9]+$'

          # Node LTS latest (mise upgrade --bump would jump to non-LTS majors)
          NODE_VERSION=$("${CURL[@]}" https://nodejs.org/dist/index.json | jq -r --arg cutoff "${CUTOFF%%T*}" '[.[] | select(.lts != false and .date <= $cutoff)] | max_by(.version | ltrimstr("v") | split(".") | map(tonumber)) | .version | ltrimstr("v")')

          ## Go latest stable
          GO_VERSION=$("${CURL[@]}" 'https://go.dev/dl/?mode=json' | jq -r '[.[] | select(.stable==true)][0].version | ltrimstr("go")')

          release_before_cutoff() {
            "${CURL[@]}" -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$1/releases?per_page=50" |
              jq -c --arg cutoff "$CUTOFF" --arg tag "$2" '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test($tag)) and .published_at <= $cutoff)] | first'
          }

          NEOVIM_VERSION=$(release_before_cutoff neovim/neovim "$SEMVER" | jq -r '.tag_name | ltrimstr("v")')

          NPM_VERSION=$("${CURL[@]}" https://registry.npmjs.org/npm | jq -r --arg cutoff "$CUTOFF" --arg semver "$SEMVER" '.time | to_entries | map(select((.key | test($semver)) and .value <= $cutoff)) | max_by(.key | split(".") | map(tonumber)) | .key')

          TERRAFORM_VERSION=$("${CURL[@]}" 'https://api.releases.hashicorp.com/v1/releases/terraform?limit=20' | jq -r --arg cutoff "$CUTOFF" '[.[] | select(.is_prerelease == false and .timestamp_created <= $cutoff)] | first | .version')

          RUSTUP_VERSION=$("${CURL[@]}" https://static.rust-lang.org/rustup/release-stable.toml | sed -n "s/^version = '\(.*\)'$/\1/p")

          TREE_SITTER_CLI_VERSION=$("${CURL[@]}" -A "hodanov/my-pde tools-bump" 'https://crates.io/api/v1/crates/tree-sitter-cli/versions?per_page=50' | jq -r --arg cutoff "$CUTOFF" --arg semver "$SEMVER" '[.versions[] | select(.yanked == false and (.num | test($semver)) and .created_at <= $cutoff) | .num] | max_by(split(".") | map(tonumber))')
          asset_sha256() {
            jq -r --arg name "$2" '.assets[] | select(.name == $name) | .digest // "" | ltrimstr("sha256:")' <<<"$1"
          }

          LUA_LS_RELEASE=$(release_before_cutoff LuaLS/lua-language-server "$SEMVER")
          LUA_LS_VERSION=$(jq -r '.tag_name' <<<"$LUA_LS_RELEASE")
          LUA_LS_SHA256_AMD64=$(asset_sha256 "$LUA_LS_RELEASE" "lua-language-server-${LUA_LS_VERSION}-linux-x64.tar.gz")
          LUA_LS_SHA256_ARM64=$(asset_sha256 "$LUA_LS_RELEASE" "lua-language-server-${LUA_LS_VERSION}-linux-arm64.tar.gz")

          MARKSMAN_RELEASE=$(release_before_cutoff artempyanykh/marksman '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
          MARKSMAN_VERSION=$(jq -r '.tag_name' <<<"$MARKSMAN_RELEASE")
          MARKSMAN_SHA256_AMD64=$(asset_sha256 "$MARKSMAN_RELEASE" marksman-linux-x64)
          MARKSMAN_SHA256_ARM64=$(asset_sha256 "$MARKSMAN_RELEASE" marksman-linux-arm64)

          UV_VERSION=$(release_before_cutoff astral-sh/uv "$SEMVER" | jq -r '.tag_name')

          # Validate resolved values before writing outputs: fail fast instead of
          # generating a broken bump PR (and a wasted docker build) when an upstream
          # endpoint errors or returns an empty/null/non-version value.
          for pair in "node=$NODE_VERSION" "go=$GO_VERSION" "neovim=$NEOVIM_VERSION" \
                      "npm=$NPM_VERSION" "terraform=$TERRAFORM_VERSION" \
                      "lua-language-server=$LUA_LS_VERSION" "rustup=$RUSTUP_VERSION" \
                      "tree-sitter-cli=$TREE_SITTER_CLI_VERSION" "uv=$UV_VERSION"; do
            name=${pair%%=*}
            val=${pair#*=}
            if [[ -z "$val" || "$val" == "null" || ! "$val" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::resolved $name version is invalid: '$val'" >&2
              exit 1
            fi
          done
          if [[ ! "$MARKSMAN_VERSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::resolved marksman version is invalid: '$MARKSMAN_VERSION'" >&2
            exit 1
          fi
          for pair in "lua-language-server linux-x64=$LUA_LS_SHA256_AMD64" \
                      "lua-language-server linux-arm64=$LUA_LS_SHA256_ARM64" \
                      "marksman linux-x64=$MARKSMAN_SHA256_AMD64" \
                      "marksman linux-arm64=$MARKSMAN_SHA256_ARM64"; do
            name=${pair%%=*}
            val=${pair#*=}
            if [[ ! "$val" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::resolved $name sha256 is invalid: '$val'" >&2
              exit 1
            fi
          done

          newer_of_pin() {
            printf '%s\n%s\n' "$(mise config get "$1")" "$2" | sort -V | tail -n 1
          }
          keep_pinned_release() {
            local version_var="${1}_VERSION"
            if [[ "$(newer_of_pin "env.$version_var" "${!version_var}")" != "${!version_var}" ]]; then
              for var in "${1}_VERSION" "${1}_SHA256_AMD64" "${1}_SHA256_ARM64"; do
                printf -v "$var" '%s' "$(mise config get "env.$var")"
              done
            fi
          }
          NODE_VERSION=$(newer_of_pin tools.node "$NODE_VERSION")
          GO_VERSION=$(newer_of_pin tools.go "$GO_VERSION")
          for var in NEOVIM_VERSION NPM_VERSION TERRAFORM_VERSION RUSTUP_VERSION TREE_SITTER_CLI_VERSION UV_VERSION; do
            printf -v "$var" '%s' "$(newer_of_pin "env.$var" "${!var}")"
          done
          keep_pinned_release LUA_LS
          keep_pinned_release MARKSMAN

          {
            echo "node=$NODE_VERSION"
            echo "go=$GO_VERSION"
            echo "neovim=$NEOVIM_VERSION"
            echo "npm=$NPM_VERSION"
            echo "terraform=$TERRAFORM_VERSION"
            echo "lua_ls=$LUA_LS_VERSION"
            echo "lua_ls_sha256_amd64=$LUA_LS_SHA256_AMD64"
            echo "lua_ls_sha256_arm64=$LUA_LS_SHA256_ARM64"
            echo "marksman=$MARKSMAN_VERSION"
            echo "marksman_sha256_amd64=$MARKSMAN_SHA256_AMD64"
            echo "marksman_sha256_arm64=$MARKSMAN_SHA256_ARM64"
            echo "rustup=$RUSTUP_VERSION"
            echo "tree_sitter_cli=$TREE_SITTER_CLI_VERSION"
            echo "uv=$UV_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Update mise.toml pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_VERSION: ${{ steps.resolve.outputs.go }}
          NODE_VERSION: ${{ steps.resolve.outputs.node }}
          LUA_LS_VERSION: ${{ steps.resolve.outputs.lua_ls }}
          LUA_LS_SHA256_AMD64: ${{ steps.resolve.outputs.lua_ls_sha256_amd64 }}
          LUA_LS_SHA256_ARM64: ${{ steps.resolve.outputs.lua_ls_sha256_arm64 }}
          MARKSMAN_VERSION: ${{ steps.resolve.outputs.marksman }}
          MARKSMAN_SHA256_AMD64: ${{ steps.resolve.outputs.marksman_sha256_amd64 }}
          MARKSMAN_SHA256_ARM64: ${{ steps.resolve.outputs.marksman_sha256_arm64 }}
          NEOVIM_VERSION: ${{ steps.resolve.outputs.neovim }}
          NPM_VERSION: ${{ steps.resolve.outputs.npm }}
          RUSTUP_VERSION: ${{ steps.resolve.outputs.rustup }}
          TERRAFORM_VERSION: ${{ steps.resolve.outputs.terraform }}
          TREE_SITTER_CLI_VERSION: ${{ steps.resolve.outputs.tree_sitter_cli }}
          UV_VERSION: ${{ steps.resolve.outputs.uv }}
        shell: bash
        run: |
          set -euo pipefail
          # Policy-pinned toolchains ([tools]) and Docker-only versions ([env])
          mise use --pin "go@$GO_VERSION" "node@$NODE_VERSION"
          mise set \
            "LUA_LS_VERSION=$LUA_LS_VERSION" \
            "LUA_LS_SHA256_AMD64=$LUA_LS_SHA256_AMD64" \
            "LUA_LS_SHA256_ARM64=$LUA_LS_SHA256_ARM64" \
            "MARKSMAN_VERSION=$MARKSMAN_VERSION" \
            "MARKSMAN_SHA256_AMD64=$MARKSMAN_SHA256_AMD64" \
            "MARKSMAN_SHA256_ARM64=$MARKSMAN_SHA256_ARM64" \
            "NEOVIM_VERSION=$NEOVIM_VERSION" \
            "NPM_VERSION=$NPM_VERSION" \
            "RUSTUP_VERSION=$RUSTUP_VERSION" \
            "TERRAFORM_VERSION=$TERRAFORM_VERSION" \
            "TREE_SITTER_CLI_VERSION=$TREE_SITTER_CLI_VERSION" \
            "UV_VERSION=$UV_VERSION"
          # Everything else in [tools] goes to the latest release older than minimum_release_age (go/node excluded above)
          mise upgrade --bump \
            actionlint zizmor \
            shfmt shellcheck stylua hadolint golangci-lint \
            'go:golang.org/x/tools/cmd/goimports' \
            'go:golang.org/x/tools/gopls' \
            'go:github.com/go-delve/delve/cmd/dlv' \
            'go:github.com/nametake/golangci-lint-langserver' \
            'go:golang.org/x/vuln/cmd/govulncheck' \
            gitleaks \
            terraform-ls tflint

      - name: Regenerate pinned artifacts
        run: mise run pins:sync

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: chore/bump-tool-versions
          TITLE: "chore: bump tool versions"
          COMMIT_MESSAGE: |-
            chore: bump tool versions

            - Node: ${{ steps.resolve.outputs.node }}
            - Go: ${{ steps.resolve.outputs.go }}
            - Neovim: ${{ steps.resolve.outputs.neovim }}
            - npm: ${{ steps.resolve.outputs.npm }}
            - Terraform: ${{ steps.resolve.outputs.terraform }}
            - lua-language-server: ${{ steps.resolve.outputs.lua_ls }}
            - marksman: ${{ steps.resolve.outputs.marksman }}
            - rustup: ${{ steps.resolve.outputs.rustup }}
            - tree-sitter-cli: ${{ steps.resolve.outputs.tree_sitter_cli }}
            - uv: ${{ steps.resolve.outputs.uv }}
            - mise-managed tools: latest eligible (see mise.toml diff)
          BODY: |-
            This PR bumps tool versions pinned in `mise.toml` and regenerates the
            derived artifacts (`mise.lock`, `environment/tools/go/go-tools.txt`,
            and the ARG defaults in `environment/docker/nvim.dockerfile`).

            Releases newer than `minimum_release_age` in `mise.toml` are skipped,
            except Go and rustup, whose sources publish no release date.

            - Node: `${{ steps.resolve.outputs.node }}` (latest eligible LTS)
            - Go: `${{ steps.resolve.outputs.go }}` (latest stable)
            - Neovim: `${{ steps.resolve.outputs.neovim }}`
            - npm CLI: `${{ steps.resolve.outputs.npm }}`
            - Terraform: `${{ steps.resolve.outputs.terraform }}`
            - lua-language-server: `${{ steps.resolve.outputs.lua_ls }}` (sha256 from release asset digests)
            - marksman: `${{ steps.resolve.outputs.marksman }}` (sha256 from release asset digests)
            - rustup: `${{ steps.resolve.outputs.rustup }}`
            - tree-sitter-cli: `${{ steps.resolve.outputs.tree_sitter_cli }}`
            - uv: `${{ steps.resolve.outputs.uv }}`
            - Other mise-managed tools: bumped to the latest eligible release (see `mise.toml` diff)

            Automated by scheduled workflow.
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          git push --force origin "$BRANCH"
          if [[ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" == "OPEN" ]]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr create --head "$BRANCH" --title "$TITLE" --body "$BODY" --label dependencies
          fi

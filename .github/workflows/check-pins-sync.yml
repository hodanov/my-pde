name: "[Check] Pins Sync"
permissions:
  contents: read

on:
  pull_request:
    paths:
      - mise.toml
      - environment/tools/go/go-tools.txt
      - environment/tools/sync-pins.sh
      - environment/docker/nvim.dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify go-tools.txt and Dockerfile ARGs are in sync with mise.toml
        run: mise run pins:check

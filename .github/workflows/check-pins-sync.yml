name: "[Check] Pins Sync"
permissions:
  contents: read

on:
  pull_request:
    paths:
      - mise.toml
      - environment/tools/go/go-tools.txt
      - environment/tools/sync-pins.sh
      - environment/docker/nvim.dockerfile
      - dotfiles/mise/go-tools.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Verify generated pins are in sync with mise.toml
        run: mise run pins:check

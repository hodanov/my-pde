name: Go module CI
permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      module:
        description: "Module name under scripts/ (e.g. config-diff)"
        required: true
        type: string
      generate-check:
        description: "Verify generated code is up to date before lint"
        required: false
        type: boolean
        default: false
      test-exclude-pattern:
        description: "grep -Ev pattern to exclude packages from go test"
        required: false
        type: string
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # mise-action caches the mise-managed toolchain binaries only, not
      # GOMODCACHE / GOCACHE. Restoring both keeps golangci-lint from
      # re-typechecking and re-building every package from scratch.
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('scripts/{0}/go.sum', inputs.module), format('scripts/{0}/go.mod', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Verify generated code is up to date
        if: inputs.generate-check
        run: |
          mise run ${{ inputs.module }}:generate
          git diff --exit-code -- scripts/${{ inputs.module }}

      - name: Run lint
        run: mise run ${{ inputs.module }}:lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/${{ inputs.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same cache as the lint job: the paths live under $HOME, so both jobs
      # share one entry per module.
      - name: Cache Go modules and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ inputs.module }}-${{ hashFiles(format('scripts/{0}/go.sum', inputs.module), format('scripts/{0}/go.mod', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ inputs.module }}-

      - name: Run tests with coverage
        env:
          EXCLUDE_PATTERN: ${{ inputs.test-exclude-pattern }}
        run: |
          if [ -n "$EXCLUDE_PATTERN" ]; then
            # shellcheck disable=SC2046  # intentional word-splitting of the go list output
            go test $(go list ./... | grep -Ev "$EXCLUDE_PATTERN") -v -count=1 -coverprofile=coverage.out
          else
            go test ./... -v -count=1 -coverprofile=coverage.out
          fi

      - name: Generate coverage report
        id: coverage
        run: |
          COVER_OUTPUT=$(go tool cover -func=coverage.out)
          TOTAL=$(echo "$COVER_OUTPUT" | grep '^total:' | awk '{print $NF}')

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "report<<${EOF}"
            echo "$COVER_OUTPUT"
            echo "${EOF}"
            echo "total=${TOTAL}"
          } >> "$GITHUB_OUTPUT"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Pass every value through env instead of expanding ${{ }} inside run:.
          # ${{ }} is substituted as text before bash parses the script, so a
          # coverage report line (which starts with a PR-controlled source file
          # path) could otherwise inject $(...) or break the BODY="..." quoting.
          REPO: ${{ github.repository }}
          MODULE: ${{ inputs.module }}
          COVERAGE_TOTAL: ${{ steps.coverage.outputs.total }}
          COVERAGE_REPORT: ${{ steps.coverage.outputs.report }}
        run: |
          MARKER="<!-- coverage-${MODULE} -->"
          BODY="${MARKER}
          ## 📊 Go Test Coverage: ${MODULE}

          **Total coverage: ${COVERAGE_TOTAL}**

          <details>
          <summary>Per-package / per-function breakdown</summary>

          \`\`\`
          ${COVERAGE_REPORT}
          \`\`\`

          </details>"

          EXISTING_COMMENT_ID=$(gh api \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" \
          )

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
              -f body="${BODY}"
          else
            gh api \
              --method POST \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}"
          fi

name: Build nvim image on dependency PRs
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-docker-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker build (environment/docker/nvim.dockerfile)
    if: |
      contains(toJson(github.event.pull_request.labels), 'dependencies') ||
      github.actor == 'dependabot[bot]' ||
      startsWith((github.head_ref || ''), 'chore/bump-tool-versions')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with versions from mise.toml
        run: mise run docker:build

name: Pipeline digest
permissions:
  contents: read
  issues: write
  pull-requests: read

on:
  schedule:
    - cron: "0 22 * * 5" # 金 22:00 UTC = 毎週土曜 7:00 JST
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch issues and pull requests
        run: |
          set -euo pipefail

          gh issue list --state all --limit 1000 \
            --json number,title,state,labels,createdAt,closedAt > issues.json
          gh pr list --state all --limit 1000 \
            --json number,title,state,headRefName,createdAt,closedAt,mergedAt > prs.json

      # The flow metrics are a bonus on top of the backlog view: if the CLI
      # fails, the digest must still be published rather than the whole run
      # going red and leaving last week's issue in place.
      - name: Build flow metrics
        continue-on-error: true
        run: |
          set -euo pipefail

          mise run pipeline-metrics:run -- \
            --issues "$GITHUB_WORKSPACE/issues.json" \
            --prs "$GITHUB_WORKSPACE/prs.json" \
            --format markdown > flow.md
          mise run pipeline-metrics:run -- \
            --issues "$GITHUB_WORKSPACE/issues.json" \
            --prs "$GITHUB_WORKSPACE/prs.json" \
            --format alerts > alerts.md

      - name: Build and publish digest issue
        run: |
          set -euo pipefail

          open_issues=$(gh issue list --state open --limit 200 --json number,title,labels,createdAt)

          triage=$(jq -r '
            .[]
            | select(any(.labels[].name; startswith("scan:"))
                and all(.labels[].name; . != "adopted" and . != "rejected"))
            | "- #\(.number) \(.title)（\((now - (.createdAt | fromdate)) / 86400 | floor) 日経過）"
          ' <<<"$open_issues")

          adopted_queue=$(jq -r '
            .[]
            | select(any(.labels[].name; . == "adopted")
                and all(.labels[].name; . != "pr-created"))
            | "- #\(.number) \(.title)"
          ' <<<"$open_issues")

          stale=$(jq -r '
            .[]
            | select(any(.labels[].name; startswith("scan:"))
                and ((now - (.createdAt | fromdate)) / 86400 >= 14))
            | "- #\(.number) \(.title)（\((now - (.createdAt | fromdate)) / 86400 | floor) 日経過）"
          ' <<<"$open_issues")

          auto_prs=$(gh pr list --state open --limit 50 --json number,title,headRefName,statusCheckRollup \
            | jq -r '
              .[]
              | select(.headRefName | startswith("auto/"))
              | ([.statusCheckRollup[]? | select(.conclusion == "FAILURE" or .state == "FAILURE")] | length) as $fails
              | "- #\(.number) \(.title)" + (if $fails > 0 then "（CI 失敗 \($fails) 件）" else "" end)
            ')

          {
            if [ -s alerts.md ]; then
              cat alerts.md
              echo
            fi
            echo "自律改善パイプラインの週次ダイジェスト（$(date -u +%Y-%m-%d) UTC 時点）。\`pipeline-digest.yml\` がこの Issue の body を毎週上書き更新する。"
            echo
            echo "## Triage 待ちの scan Issue（adopted / rejected 未判定）"
            echo
            echo "${triage:-なし}"
            echo
            echo "## PR 化待ちの adopted Issue（pr-created 未付与）"
            echo
            echo "${adopted_queue:-なし}"
            echo
            echo "## Open な auto/* PR"
            echo
            echo "${auto_prs:-なし}"
            echo
            echo "## 14 日以上 Open のままの scan Issue"
            echo
            echo "${stale:-なし}"
            echo
            if [ -s flow.md ]; then
              cat flow.md
            else
              echo "## 成果（フロー）指標"
              echo
              echo "メトリクスの生成に失敗した。ワークフローの \`Build flow metrics\` ステップのログを参照。"
            fi
          } > body.md

          gh label create digest --description "Auto-updated pipeline digest" --color BFD4F2 || true

          num=$(gh issue list --state open --label digest --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
          else
            gh issue create --title "Pipeline digest" --label digest --body-file body.md
            num=$(gh issue list --state open --label digest --limit 1 --json number --jq '.[0].number // empty')
          fi

          # The alert label is a notification that clears itself: it goes on when
          # a threshold is breached and comes off once the figures recover, so
          # the digest stays a single issue instead of a stream of them.
          gh label create alert --description "Pipeline metric threshold breached" --color D93F0B || true
          if [ -n "$num" ]; then
            if [ -s alerts.md ]; then
              gh issue edit "$num" --add-label alert
            else
              gh issue edit "$num" --remove-label alert || true
            fi
          fi

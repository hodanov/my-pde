name: CI agent-stats
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "scripts/agent-stats/**"
      - .github/workflows/go_module_ci.yml
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/go_module_ci.yml
    with:
      module: agent-stats
